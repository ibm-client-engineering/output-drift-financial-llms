name: Publish DFAH package

on:
  push:
    tags:
      - "dfah-v*"

permissions:
  contents: read

jobs:
  identity:
    name: Verify release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = f"dfah-v{project['project']['version']}"
          observed = os.environ["RELEASE_TAG"]
          if observed != expected:
              raise SystemExit(
                  f"release tag {observed!r} does not match project version "
                  f"{expected!r}"
              )
          print(f"Release identity verified: {observed}")
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::release tag must point to a commit already on main"
            exit 1
          }

  validate:
    name: Validate the tagged package
    needs: identity
    uses: ./.github/workflows/dfah-package.yml

  publish:
    name: Publish distributions to PyPI
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dfah-bench
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dfah-distributions
          path: dist/
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
